{% extends "base.html" %}
{% block title %}Dashboard · bdsnode{% endblock %}
{% block nav_dashboard %}active{% endblock %}

{% block head %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
{% endblock %}

{% block content %}
<h1 class="text-xl font-semibold text-slate-200 mb-6">Dashboard</h1>

<div id="dashboard-data"
     hx-get="/dashboard/data"
     hx-trigger="load"
     hx-swap="innerHTML">
  <!-- Shown while bdsnode warms up and RPC calls complete -->
  <div class="flex flex-col items-center justify-center py-32 gap-5 text-slate-500">
    <svg class="animate-spin h-10 w-10 text-blue-500"
         xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10"
              stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
    </svg>
    <p class="text-base font-medium text-slate-300">Starting Dashboard, please wait…</p>
    <p class="text-xs text-slate-600">Warming up shards and querying telemetry stores</p>
  </div>
</div>
{% endblock %}
