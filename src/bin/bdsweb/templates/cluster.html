{% extends "base.html" %}
{% block title %}Cluster · bdsnode{% endblock %}
{% block nav_cluster %}active{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-6">
  <div>
    <h1 class="text-xl font-semibold text-slate-200">Cluster</h1>
    <p class="text-xs text-slate-500 mt-0.5">
      P2P membership, peer table, replication mode · auto-refresh every {{ refresh_secs }}s
    </p>
  </div>
  <button id="cluster-reload"
          type="button"
          class="btn btn-primary"
          hx-get="/cluster/refresh"
          hx-target="#cluster-data"
          hx-swap="innerHTML"
          hx-disabled-elt="this">
    Reload
  </button>
</div>

<div id="cluster-data"
     hx-get="/cluster/data"
     hx-trigger="load, every {{ refresh_secs }}s"
     hx-swap="innerHTML">
  <!-- Initial placeholder until /cluster/data responds -->
  <div class="flex flex-col items-center justify-center py-32 gap-5 text-slate-500">
    <svg class="animate-spin h-10 w-10 text-blue-500"
         xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10"
              stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
    </svg>
    <p class="text-base font-medium text-slate-300">Wait…</p>
    <p class="text-xs text-slate-600">Loading cached snapshot</p>
  </div>
</div>

<script>
  // Show a "Wait" placeholder in #cluster-data the moment the Reload
  // button is clicked, so the user gets immediate feedback while the
  // live RPC runs.  Matches the Dashboard pattern.
  (function () {
    var btn = document.getElementById('cluster-reload');
    if (!btn) return;
    btn.addEventListener('htmx:beforeRequest', function () {
      var target = document.getElementById('cluster-data');
      if (!target) return;
      target.innerHTML =
        '<div class="flex flex-col items-center justify-center py-32 gap-5 text-slate-500">' +
        '<svg class="animate-spin h-10 w-10 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">' +
        '<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>' +
        '<path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>' +
        '</svg>' +
        '<p class="text-base font-medium text-slate-300">Wait…</p>' +
        '<p class="text-xs text-slate-600">Live refresh in progress</p>' +
        '</div>';
    });
  })();
</script>
{% endblock %}
