<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>bdsweb · sign in</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0a0d14; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .card { background: #0e1520; border: 1px solid #1e2535; }
    input { background: #0a0d14; border: 1px solid #1e2535; color: #e2e8f0; padding: 0.5rem 0.75rem; border-radius: 0.375rem; }
    input:focus { outline: 2px solid #3b82f6; outline-offset: -1px; }
    button.primary { background: #3b82f6; color: white; padding: 0.5rem 1rem; border-radius: 0.375rem; font-weight: 500; }
    button.primary:hover { background: #2563eb; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">
  <div class="card rounded-lg w-full max-w-sm p-6">
    <header class="mb-6 text-center">
      <h1 class="text-xl font-semibold text-white">bdsweb</h1>
      <p class="text-xs text-slate-500 mt-1">sign in</p>
    </header>

    {% if open_access %}
    <div class="mb-4 rounded border border-yellow-700 bg-yellow-950 px-3 py-2 text-xs text-yellow-300">
      bdsweb is running in <strong>open-access mode</strong> (no <code class="text-yellow-200">cluster.shared_secret</code>
      in config).  Signing in here is a no-op &mdash; you already have full access.
    </div>
    {% endif %}

    {% if has_error %}
    <div class="mb-4 rounded border border-red-800 bg-red-950 px-3 py-2 text-xs text-red-300">
      {{ error_msg }}
    </div>
    {% endif %}

    <form method="post" action="/login" class="space-y-3">
      <input type="hidden" name="next" value="{{ next }}" />
      <div>
        <label class="block text-xs text-slate-400 mb-1" for="username">Username</label>
        <input class="w-full" type="text" id="username" name="username" required autocomplete="username" autofocus />
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1" for="password">Password</label>
        <input class="w-full" type="password" id="password" name="password" required autocomplete="current-password" />
      </div>
      <div class="pt-2 flex justify-end">
        <button class="primary" type="submit">Sign in</button>
      </div>
    </form>
  </div>
</body>
</html>
